# Nightly self-test (Stage 4 of unified-systems-com/tap#363, req-tap-plugin-extdev-repo-ci-12).
#
# A THIN CALLER. Everything this lane does — running the plugin against core `main`, and
# turning a red night into one issue that the next green closes — lives in core's reusable
# `plugin-nightly.yml`, so it is fixed once for every plugin instead of fifteen times.
#
# Only what cannot move lives here: the `schedule` trigger (a reusable workflow's own triggers
# are not consulted when it is called), the cron MINUTE (staggered per repo so the org's
# nightlies do not burst), the slug, the pin, and the grant.
#
# No `latest_ref`: this repository dropped the "latest core release" row deliberately (PR #4).
# The floor is proven on every push, a release is too late to be early warning, and a hardcoded
# release ref goes stale and reds the whole run on a question nobody is asking. The input is
# optional for exactly that reason.
name: nightly
on:
  schedule:
    - cron: "18 10 * * *"   # minute staggered per repo so the org's nightlies do not burst
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    uses: unified-systems-com/tap/.github/workflows/plugin-nightly.yml@57505751b27900e5d58fc0c2b40df32f18a2b980
    # REQUIRED on this job. GitHub checks every job of a called workflow — and of the workflows
    # IT calls — against this grant BEFORE starting anything, so a scope short here fails the
    # whole run at startup with zero jobs and no log. `security-events: write` is plugin-ci's
    # SARIF upload; `issues: write` is the owner-issue job and is the only write in the tree.
    permissions:
      contents: read
      security-events: write
      issues: write
    with:
      plugin_slug: grid_fixtures
      assignee: notgeorge   # no CODEOWNERS in this repo — the org's maintainer login
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
